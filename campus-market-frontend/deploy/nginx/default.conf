# 访问日志：不记录查询参数（图片签名、搜索词都在查询参数里），带上与 API 日志相同的请求编号
log_format campus '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                  'rt=$request_time rid=$request_id ua="$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  server_tokens off;
  access_log /var/log/nginx/access.log campus;
  # 安全响应头在 server 级统一设置；下面的 location 都不再写 add_header，以免覆盖继承
  include /etc/nginx/conf.d/security-headers.conf.inc;
  location = /admin { return 302 /admin/; }
  location /admin/ {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    # 后台容器自己的同名响应头隐藏掉，只保留这里统一设置的一份
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
  }
  # 阶段 4：图片上传单张最大 5 MB（后端再按文件头与尺寸校验）；其余接口仍是 1 MB
  location /v1/images {
    client_max_body_size 6m;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 请求编号由 nginx 生成并传给 API：两边日志可以按同一个编号对上（客户端自带的 X-Request-ID 被覆盖）
    proxy_set_header X-Request-ID $request_id;
  }
  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 请求编号由 nginx 生成并传给 API：两边日志可以按同一个编号对上（客户端自带的 X-Request-ID 被覆盖）
    proxy_set_header X-Request-ID $request_id;
  }
  location / { try_files $uri $uri/ /index.html; }
}
