# 阶段 2：安全响应头（网页与 /admin/ 共用）。E2E 的静态服务器读取同一个文件，真实浏览器测试在同样的 CSP 下运行。
# - 脚本只允许同源；MUI / emotion 运行时注入样式，style-src 需要 'unsafe-inline'；
# - 商品图片目前是卖家填写的 https 地址（示例图来自外部站点），img-src 暂时放开 https:，接入自有对象存储后收紧为该域名；
# - 不允许任何站点用 iframe 嵌入（防点击劫持）；表单只能提交到同源。
# HSTS 由前面终止 HTTPS 的反向代理设置（这里是容器内的 http，设置了也会被浏览器忽略）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
