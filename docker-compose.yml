version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # 仅供本机开发：固定的开发密码，只绑定 127.0.0.1（不对局域网 / 公网开放）。任何服务器部署请使用
    # campus-market-frontend/deploy/docker-compose.yml，见 docs/local-deployment.md
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_market"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    name: campus_market_pgdata
