version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_market"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    name: campus_market_pgdata
